{% extends "base.html" %}
{% block contenido %}
<h1>Seguimiento de cobro 5.4</h1>
<table>
  <tr><th>ID</th><th>Colaborador</th><th>Estado</th><th>Valor EPS</th><th></th></tr>
  {% for i in items %}
  <tr>
    <td>{{ i.id }}</td><td>{{ i.colaborador.nombre_completo }}</td><td>{{ i.estado }}</td>
    <td>{{ formato_moneda(i.valor_eps) }}</td>
    <td><a href="{{ url_for('cobro.detalle', incapacidad_id=i.id) }}">Gestionar</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
